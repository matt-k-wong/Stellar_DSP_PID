# Reusable generic profile. This configuration is intentionally not ready to
# guide: identify the mount, install/identify a guide camera, verify an
# arcsecond-conversion source, and measure pulse response before enabling it.

[indi]
host = "localhost"
port = 7624
# INDI device publishing the project's verified arcsecond measurement
# contract (usually a future centroid bridge; may differ from the camera).
camera_device = ""
mount_device = ""
guide_exposure = 2.0

[dsp]
sample_rate = 10.0
filter_cutoff_hz = 0.05
filter_q = 0.7071
oversample_ratio = 20

[mount]
# 0 means no worm period has been supplied.
worm_period_secs = 0.0

# Initial theoretical scale for a 0.5x sidereal guide rate at Dec 0.
# This is not a measurement of any connected mount. Measure both axes and
# directions before using it for guiding.
arcsec_per_ms_ra = 0.007521
arcsec_per_ms_dec = 0.007521

max_pulse_ms = 1000.0
min_pulse_ms = 10.0
# Zero holds the profile in a safe, non-guiding state until deliberately tuned.
aggressiveness = 0.0

[guider]
kp = 0.6
ki = 0.02
kd = 0.0
integral_clamp = 10.0
backlash_compensation_ms = 0.0
enable_pe_correction = false
# PE curves remain phase-uncertain until a mount worm-phase reference is added.
# pe_curve_path = "config/pe_curve.json"
